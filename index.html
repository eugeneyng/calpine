<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>calpine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/skeleton-css@2.0.4/css/skeleton.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/moment-timezone@6.1.10/index.global.min.js"></script>
  </head>
  <body x-data="calendarApp()" x-init="init()" class="container u-full-width u-max-full-width">
    <main style="padding: 0 1%">
      <h4>calpine <progress x-show="loading" aria-label="Loading events"></progress></h4>
      <div id="calendar"></div>
    </main>

    <dialog x-ref="dialog" @close="modal = false">
      <article>
        <header>
          <h2 x-text="editing ? 'Edit event' : 'New event'"></h2>
          <button aria-label="Close" type="button" class="u-pull-right" @click="close()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>
        <form @submit.prevent="save()">
          <label for="title">Title</label>
          <input id="title" type="text" class="u-full-width" x-model="form.title" required autofocus />
          <label for="location">Location</label>
          <input id="location" type="text" class="u-full-width" x-model="form.location" />
          <label for="allDay"><input id="allDay" type="checkbox" x-model="form.allDay" @change="reformat()" /> All day</label>
          <label for="start">Start</label>
          <input id="start" :type="form.allDay ? 'date' : 'datetime-local'" class="u-full-width" x-model="form.start" required />
          <label for="end">End</label>
          <input id="end" :type="form.allDay ? 'date' : 'datetime-local'" class="u-full-width" x-model="form.end" />
          <label for="frequency">Repeat</label>
          <select id="frequency" class="u-full-width" x-model="form.frequency">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
          <label x-show="form.frequency !== 'none'" for="until">Repeat until</label>
          <input x-show="form.frequency !== 'none'" id="until" type="date" class="u-full-width" x-model="form.until" />
          <fieldset x-show="editing && form.recurring">
            <legend>Apply changes to</legend>
            <label><input type="radio" value="occurrence" x-model="form.scope" /> This event</label>
            <label><input type="radio" value="series" x-model="form.scope" /> Entire series</label>
          </fieldset>
          <footer>
            <button type="button" x-show="editing" @click="remove()">Delete</button>
            <button type="button" @click="close()">Cancel</button>
            <button type="submit" class="button-primary">Save</button>
          </footer>
        </form>
      </article>
    </dialog>

    <script>
      function calendarApp() {
        return {
          calendar: null,
          modal: false,
          loading: false,
          editing: false,
          event: null,
          timezone: "UTC",
          form: { title: "", location: "", start: "", end: "", allDay: false, frequency: "none", until: "", recurring: false, scope: "series" },

          async init() {
            const app = this;
            const timezoneResponse = await fetch("/api/timezone");
            const timezoneData = await timezoneResponse.json();
            if (!timezoneResponse.ok) throw new Error(timezoneData.error || "Could not load timezone");
            this.timezone = timezoneData.timezone;
            this.calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
              timeZone: this.timezone,
              initialView: "dayGridMonth",
              height: "calc(100vh - 8rem)",
              expandRows: true,
              headerToolbar: {
                left: "prev,next today refresh",
                center: "title",
                right: "addEvent dayGridMonth,timeGridWeek,timeGridDay",
              },
              customButtons: {
                addEvent: {
                  text: "+",
                  hint: "Add event",
                  click: () => {
                    app.calendar.gotoDate(moment.tz(app.timezone).toDate());
                    app.openNew();
                  },
                },
                refresh: {
                  text: "refresh",
                  click: () => app.calendar.refetchEvents(),
                },
              },
              loading(isLoading) {
                app.loading = isLoading;
              },
              editable: true,
              selectable: true,
              events(info, success, failure) {
                fetch(`/api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`, { cache: "no-store" })
                  .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not load events");
                    return data;
                  })
                  .then(success)
                  .catch(failure);
              },
              select(info) {
                app.openNew(info.start, info.end, info.allDay, info.startStr, info.endStr);
              },
              dateClick(info) {
                if (info.allDay) {
                  const start = info.dateStr.slice(0, 10);
                  app.openNew(null, null, true, start, moment(start).add(1, "day").format("YYYY-MM-DD"));
                } else {
                  app.openNew(info.date, moment(info.date).add(1, "hour").toDate(), false);
                }
              },
              eventChange(info) {
                if (info.event.extendedProps.recurring) {
                  info.revert();
                  app.openEdit(info.event);
                } else {
                  app.update(info.event, info.revert);
                }
              },
              eventClick(info) {
                info.jsEvent.preventDefault();
                app.openEdit(info.event);
              },
            });
            this.calendar.render();
          },

          inputDate(value) {
            return moment.tz(value, this.timezone).format("YYYY-MM-DDTHH:mm");
          },

          // All-day values are calendar dates, not instants. startStr is already the
          // date-only string and never gets shifted by the browser/server offset --
          // converting it through moment.tz would move the event by a day.
          dateOnly(value) {
            return (typeof value === "string" ? value : "").slice(0, 10);
          },

          baseForm() {
            return { title: "", location: "", start: "", end: "", allDay: false, frequency: "none", until: "", recurring: false, scope: "series" };
          },

          // Toggling all-day swaps the input type, so the bound values have to be
          // reshaped too or the field silently reads as empty.
          reformat() {
            const convert = this.form.allDay
              ? (value) => this.dateOnly(value)
              : (value) => moment.tz(value, this.timezone).format("YYYY-MM-DDTHH:mm");
            this.form.start = convert(this.form.start);
            this.form.end = convert(this.form.end);
          },

          // Single entry point for bringing up a blank event. FullCalendar passes
          // an explicit range when it has one; with no start we anchor on "now" in
          // the server's timezone and default to an hour long. All-day callers send
          // date-only strings, since a Date would be shifted by the offset.
          openNew(start = null, end = null, allDay = false, startStr = "", endStr = "") {
            if (!start && !allDay) {
              start = moment.tz(this.timezone).toDate();
              end = moment(start).add(1, "hour").toDate();
            }
            this.editing = false;
            this.event = null;
            this.form = {
              ...this.baseForm(),
              allDay,
              start: allDay ? this.dateOnly(startStr) : this.inputDate(start),
              end: allDay ? this.dateOnly(endStr) : this.inputDate(end),
            };
            this.modal = true;
            this.$refs.dialog.showModal();
          },

          openEdit(event) {
            const recurring = event.extendedProps.recurring;
            const allDay = Boolean(event.allDay || event.extendedProps.allDay);
            this.editing = true;
            this.event = event;
            this.form = {
              ...this.baseForm(),
              title: event.title,
              location: event.extendedProps.location || "",
              allDay,
              start: allDay ? this.dateOnly(event.startStr) : this.inputDate(event.start),
              end: event.end ? (allDay ? this.dateOnly(event.endStr) : this.inputDate(event.end)) : "",
              recurring,
              frequency: event.extendedProps.frequency || "none",
              until: event.extendedProps.until || "",
              scope: "series",
              recurrenceId: event.extendedProps.recurrenceId || "",
            };
            this.modal = true;
            this.$refs.dialog.showModal();
          },

          close() {
            this.modal = false;
            if (this.$refs.dialog.open) this.$refs.dialog.close();
          },

          save() {
            const method = this.editing ? "PUT" : "POST";
            const url = this.editing ? `/api/events/${this.event.id}` : "/api/events";
            fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(this.form),
            })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not save event");
                return data;
              })
              .then(() => {
                this.close();
                this.calendar.refetchEvents();
              })
              .catch(error => alert(error.message));
          },

          remove() {
            const scope = this.form.recurring ? this.form.scope : "series";
            if (!confirm(`Delete ${scope === "occurrence" ? "this event" : "event series"}?`)) return;
            this.close();
            const query = scope === "occurrence" ? "?scope=occurrence" : "";
            fetch(`/api/events/${this.event.id}${query}`, { method: "DELETE" })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not delete event");
              })
              .then(() => {
                this.calendar.refetchEvents();
              })
              .catch(error => {
                alert(error.message);
                this.calendar.refetchEvents();
              });
          },

          update(event, revert) {
            fetch(`/api/events/${event.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                title: event.title,
                location: event.extendedProps.location || "",
                start: event.startStr,
                end: event.endStr,
                allDay: Boolean(event.allDay || event.extendedProps.allDay),
              }),
            }).then(response => {
              if (!response.ok) throw new Error("Could not update event");
            }).catch(error => {
              alert(error.message);
              revert();
            });
          },
        };
      }
    </script>
  </body>
</html>
