<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>calpine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/moment-timezone@6.1.10/index.global.min.js"></script>
  </head>
  <body x-data="calendarApp()" x-init="init()" class="container-fluid">
    <main class="p-3">
      <div class="d-flex align-items-center gap-2 mb-3">
        <h4 class="mb-0">calpine</h4>
        <div class="spinner-border spinner-border-sm text-primary" role="status" x-show="loading">
          <span class="visually-hidden">Loading events</span>
        </div>
      </div>
      <div id="calendar"></div>
    </main>

    <div class="modal fade" x-ref="dialog" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form @submit.prevent="save()">
            <div class="modal-header">
              <h5 class="modal-title" x-text="editing ? (form.recurring && form.scope === 'series' ? 'Edit series' : 'Edit event') : 'New event'"></h5>
              <button type="button" class="btn-close" aria-label="Close" @click="close()"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input id="title" type="text" class="form-control" x-ref="title" x-model="form.title" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="location">Location</label>
                <input id="location" type="text" class="form-control" x-model="form.location" />
              </div>
              <div class="form-check mb-3">
                <input id="allDay" type="checkbox" class="form-check-input" x-model="form.allDay" @change="reformat()" />
                <label class="form-check-label" for="allDay">All day</label>
              </div>
              <div class="mb-3">
                <label class="form-label" for="start">Start</label>
                <input id="start" :type="form.allDay ? 'date' : 'datetime-local'" class="form-control" x-model="form.start" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="end">End</label>
                <input id="end" :type="form.allDay ? 'date' : 'datetime-local'" class="form-control" x-model="form.end" />
              </div>
              <div class="mb-3" x-show="!form.recurring || form.scope === 'series'">
                <label class="form-label" for="frequency">Repeat</label>
                <select id="frequency" class="form-select" x-model="form.frequency">
                  <option value="none">Does not repeat</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                  <template x-if="customFrequency">
                    <option :value="customFrequency" x-text="'Custom (' + customFrequency + ')'"></option>
                  </template>
                </select>
              </div>
              <div class="mb-3" x-show="(!form.recurring || form.scope === 'series') && form.frequency !== 'none'">
                <label class="form-label" for="until">Repeat until</label>
                <input id="until" type="date" class="form-control" x-model="form.until" />
              </div>
              <fieldset class="mb-3" x-show="editing && form.recurring">
                <legend class="fs-6">Apply changes to</legend>
                <div class="form-check">
                  <input id="scope-occurrence" type="radio" class="form-check-input" value="occurrence" :checked="form.scope === 'occurrence'" @change="switchScope('occurrence')" />
                  <label class="form-check-label" for="scope-occurrence">This event</label>
                </div>
                <div class="form-check">
                  <input id="scope-series" type="radio" class="form-check-input" value="series" :checked="form.scope === 'series'" :disabled="!forms.series" @change="switchScope('series')" />
                  <label class="form-check-label" for="scope-series">Entire series <span class="text-muted fw-normal" x-show="!forms.series && !seriesError">(loading…)</span></label>
                </div>
                <div class="form-text text-danger" x-show="seriesError" x-text="seriesError"></div>
              </fieldset>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger me-auto" x-show="editing" @click="remove()">Delete</button>
              <button type="button" class="btn btn-secondary" @click="close()">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      function calendarApp() {
        return {
          calendar: null,
          dialog: null,
          loading: false,
          editing: false,
          event: null,
          timezone: "UTC",
          form: { title: "", location: "", start: "", end: "", allDay: false, frequency: "none", until: "", recurring: false, scope: "series", recurrenceId: "" },
          // The dialog holds one snapshot per scope so switching between "This
          // event" and "Entire series" doesn't lose edits made to the other one.
          forms: { occurrence: null, series: null },
          // What the series looked like when it was loaded; used to send only
          // the recurrence fields the user actually changed.
          baseline: { frequency: "none", until: "", allDay: false },
          frequencyOptions: ["none", "daily", "weekly", "monthly", "yearly"],
          customFrequency: "",
          seriesError: "",
          editToken: 0,

          async init() {
            const app = this;
            const timezoneResponse = await fetch("/api/timezone");
            const timezoneData = await timezoneResponse.json();
            if (!timezoneResponse.ok) throw new Error(timezoneData.error || "Could not load timezone");
            this.timezone = timezoneData.timezone;
            this.dialog = new bootstrap.Modal(this.$refs.dialog);
            this.$refs.dialog.addEventListener("shown.bs.modal", () => app.$refs.title.focus());
            this.calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
              timeZone: this.timezone,
              themeSystem: "bootstrap5",
              initialView: "dayGridMonth",
              height: "calc(100vh - 9rem)",
              expandRows: true,
              headerToolbar: {
                left: "prev,next today refresh",
                center: "title",
                right: "addEvent dayGridMonth,timeGridWeek,timeGridDay",
              },
              customButtons: {
                addEvent: {
                  text: "+",
                  hint: "Add event",
                  click: () => {
                    app.calendar.gotoDate(moment.tz(app.timezone).toDate());
                    app.openNew();
                  },
                },
                refresh: {
                  text: "refresh",
                  click: () => app.calendar.refetchEvents(),
                },
              },
              loading(isLoading) {
                app.loading = isLoading;
              },
              editable: true,
              selectable: true,
              events(info, success, failure) {
                fetch(`/api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`, { cache: "no-store" })
                  .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not load events");
                    return data;
                  })
                  .then(success)
                  .catch(failure);
              },
              select(info) {
                app.openNew(info.start, info.end, info.allDay, info.startStr, info.endStr);
              },
              dateClick(info) {
                if (info.allDay) {
                  const start = info.dateStr.slice(0, 10);
                  app.openNew(null, null, true, start, moment(start).add(1, "day").format("YYYY-MM-DD"));
                } else {
                  app.openNew(info.date, moment(info.date).add(1, "hour").toDate(), false);
                }
              },
              eventChange(info) {
                if (info.event.extendedProps.recurring) {
                  info.revert();
                  app.openEdit(info.event);
                } else {
                  app.update(info.event, info.revert);
                }
              },
              eventClick(info) {
                info.jsEvent.preventDefault();
                app.openEdit(info.event);
              },
            });
            this.calendar.render();
          },

          inputDate(value) {
            return moment.tz(value, this.timezone).format("YYYY-MM-DDTHH:mm");
          },

          // All-day values are calendar dates, not instants. startStr is already the
          // date-only string and never gets shifted by the browser/server offset --
          // converting it through moment.tz would move the event by a day.
          dateOnly(value) {
            return (typeof value === "string" ? value : "").slice(0, 10);
          },

          baseForm() {
            return { title: "", location: "", start: "", end: "", allDay: false, frequency: "none", until: "", recurring: false, scope: "series", recurrenceId: "" };
          },

          // The editable fields of whichever scope is currently in the dialog.
          formFields() {
            const { title, location, allDay, start, end, frequency, until } = this.form;
            return { title, location, allDay, start, end, frequency, until };
          },

          // Swap the dialog to the occurrence's or the series' snapshot. The
          // Repeat controls only make sense for the series; occurrences don't
          // carry an RRULE of their own.
          switchScope(scope) {
            if (!this.editing || !this.form.recurring || scope === this.form.scope) return;
            if (scope === "series" && !this.forms.series) return;
            this.forms[this.form.scope] = this.formFields();
            this.form = {
              ...this.forms[scope],
              recurring: true,
              scope,
              recurrenceId: this.form.recurrenceId,
            };
          },

          // Toggling all-day swaps the input type, so the bound values have to be
          // reshaped too or the field silently reads as empty.
          reformat() {
            const convert = this.form.allDay
              ? (value) => this.dateOnly(value)
              : (value) => moment.tz(value, this.timezone).format("YYYY-MM-DDTHH:mm");
            this.form.start = convert(this.form.start);
            this.form.end = convert(this.form.end);
          },

          // Single entry point for bringing up a blank event. FullCalendar passes
          // an explicit range when it has one; with no start we anchor on "now" in
          // the server's timezone and default to an hour long. All-day callers send
          // date-only strings, since a Date would be shifted by the offset.
          openNew(start = null, end = null, allDay = false, startStr = "", endStr = "") {
            if (!start && !allDay) {
              start = moment.tz(this.timezone).toDate();
              end = moment(start).add(1, "hour").toDate();
            }
            this.editToken += 1;
            this.editing = false;
            this.event = null;
            this.forms = { occurrence: null, series: null };
            this.baseline = { frequency: "none", until: "", allDay };
            this.customFrequency = "";
            this.seriesError = "";
            this.form = {
              ...this.baseForm(),
              allDay,
              start: allDay ? this.dateOnly(startStr) : this.inputDate(start),
              end: allDay ? this.dateOnly(endStr) : this.inputDate(end),
            };
            this.dialog.show();
          },

          openEdit(event) {
            const recurring = event.extendedProps.recurring;
            const allDay = Boolean(event.allDay || event.extendedProps.allDay);
            const recurrenceId = event.extendedProps.recurrenceId || "";
            const occurrence = {
              title: event.title,
              location: event.extendedProps.location || "",
              allDay,
              start: allDay ? this.dateOnly(event.startStr) : this.inputDate(event.start),
              end: event.end ? (allDay ? this.dateOnly(event.endStr) : this.inputDate(event.end)) : "",
              frequency: event.extendedProps.frequency || "none",
              until: event.extendedProps.until || "",
            };
            this.editToken += 1;
            const token = this.editToken;
            this.editing = true;
            this.event = event;
            this.forms = { occurrence, series: null };
            this.customFrequency = "";
            this.seriesError = "";
            if (recurring) {
              // Expanded occurrences never carry the series' RRULE, so reset the
              // occurrence snapshot's recurrence fields; the series snapshot
              // loaded below supplies them.
              occurrence.frequency = "none";
              occurrence.until = "";
              this.baseline = { frequency: "none", until: "", allDay };
              this.form = { ...occurrence, recurring: true, scope: "occurrence", recurrenceId };
              if (event.extendedProps.seriesId) {
                this.loadSeries(event.extendedProps.seriesId, token);
              } else {
                this.seriesError = "Could not load the rest of the series; only this event can be edited.";
              }
            } else {
              this.baseline = { frequency: occurrence.frequency, until: occurrence.until, allDay };
              this.forms.series = { ...occurrence };
              this.form = { ...occurrence, recurring: false, scope: "series", recurrenceId: "" };
            }
            this.dialog.show();
          },

          async loadSeries(seriesId, token) {
            try {
              const response = await fetch(`/api/series/${encodeURIComponent(seriesId)}`, { cache: "no-store" });
              const data = await response.json();
              if (!response.ok) throw new Error(data.error || "Could not load event series");
              if (token !== this.editToken) return;
              const allDay = Boolean(data.allDay);
              const series = {
                title: data.title || "",
                location: data.location || "",
                allDay,
                start: allDay ? this.dateOnly(data.start) : this.inputDate(data.start),
                end: data.end ? (allDay ? this.dateOnly(data.end) : this.inputDate(data.end)) : "",
                frequency: data.frequency || "none",
                until: data.until || "",
              };
              this.forms.series = series;
              this.baseline = { frequency: series.frequency, until: series.until, allDay };
              this.customFrequency = this.frequencyOptions.includes(series.frequency) ? "" : series.frequency;
            } catch (error) {
              if (token !== this.editToken) return;
              this.seriesError = "Could not load the rest of the series; only this event can be edited.";
            }
          },

          close() {
            // Invalidate any in-flight series fetch so it can't update a
            // dialog that was closed or reopened for another event.
            this.editToken += 1;
            this.dialog.hide();
          },

          save() {
            if (this.editing && this.form.recurring && this.form.scope === "series" && !this.forms.series) {
              alert("Could not load the rest of the series; only this event can be edited.");
              return;
            }
            const method = this.editing ? "PUT" : "POST";
            const url = this.editing ? `/api/events/${this.event.id}` : "/api/events";
            const payload = {
              title: this.form.title,
              location: this.form.location,
              start: this.form.start,
              end: this.form.end,
              allDay: this.form.allDay,
            };
            if (this.editing && this.form.recurring) {
              payload.scope = this.form.scope;
              if (this.form.scope === "occurrence") {
                payload.recurrenceId = this.form.recurrenceId;
              } else {
                // Send only what changed. An untouched rule is left alone so
                // BYDAY/COUNT/INTERVAL survive; until is also sent when allDay
                // changes so the server can re-type the UNTIL value.
                if (this.form.frequency !== this.baseline.frequency) {
                  payload.frequency = this.form.frequency;
                }
                if (this.form.until !== this.baseline.until || this.form.allDay !== this.baseline.allDay) {
                  payload.until = this.form.until;
                }
              }
            } else {
              payload.frequency = this.form.frequency;
              payload.until = this.form.until;
            }
            fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not save event");
                return data;
              })
              .then(() => {
                this.close();
                this.calendar.refetchEvents();
              })
              .catch(error => alert(error.message));
          },

          remove() {
            if (this.editing && this.form.recurring && this.form.scope === "series" && !this.forms.series) {
              alert("Could not load the rest of the series; only this event can be edited.");
              return;
            }
            const scope = this.form.recurring ? this.form.scope : "series";
            if (!confirm(`Delete ${scope === "occurrence" ? "this event" : "event series"}?`)) return;
            this.close();
            const query = scope === "occurrence" ? "?scope=occurrence" : "";
            fetch(`/api/events/${this.event.id}${query}`, { method: "DELETE" })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not delete event");
              })
              .then(() => {
                this.calendar.refetchEvents();
              })
              .catch(error => {
                alert(error.message);
                this.calendar.refetchEvents();
              });
          },

          update(event, revert) {
            fetch(`/api/events/${event.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                title: event.title,
                location: event.extendedProps.location || "",
                start: event.startStr,
                end: event.endStr,
                allDay: Boolean(event.allDay || event.extendedProps.allDay),
              }),
            }).then(response => {
              if (!response.ok) throw new Error("Could not update event");
            }).catch(error => {
              alert(error.message);
              revert();
            });
          },
        };
      }
    </script>
  </body>
</html>
