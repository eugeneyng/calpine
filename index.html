<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CalDAV Calendar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  </head>
  <body x-data="calendarApp()" x-init="init()" class="container">
    <main>
      <h1>CalDAV Calendar Interface</h1>
      <div id="calendar"></div>
    </main>

    <dialog x-ref="dialog" @close="modal = false">
      <article>
        <header>
          <button aria-label="Close" rel="prev" type="button" @click="close()"></button>
          <h2 x-text="editing ? 'Edit event' : 'New event'"></h2>
        </header>
        <form @submit.prevent="save()">
          <label for="title">Title</label>
          <input id="title" x-model="form.title" required autofocus />
          <label for="start">Start</label>
          <input id="start" type="datetime-local" x-model="form.start" required />
          <label for="end">End</label>
          <input id="end" type="datetime-local" x-model="form.end" />
          <label for="frequency">Repeat</label>
          <select id="frequency" x-model="form.frequency">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
          <label x-show="form.frequency !== 'none'" for="until">Repeat until</label>
          <input x-show="form.frequency !== 'none'" id="until" type="date" x-model="form.until" />
          <fieldset x-show="editing && form.recurring">
            <legend>Apply changes to</legend>
            <label><input type="radio" value="occurrence" x-model="form.scope" /> This event</label>
            <label><input type="radio" value="series" x-model="form.scope" /> Entire series</label>
          </fieldset>
          <footer>
            <button type="button" class="secondary" x-show="editing" @click="remove()">Delete</button>
            <button type="button" class="secondary" @click="close()">Cancel</button>
            <button type="submit">Save</button>
          </footer>
        </form>
      </article>
    </dialog>

    <script>
      function calendarApp() {
        return {
          calendar: null,
          modal: false,
          editing: false,
          event: null,
          form: { title: "", start: "", end: "", frequency: "none", until: "", recurring: false, scope: "series" },

          init() {
            const app = this;
            this.calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
              initialView: "dayGridMonth",
              height: "calc(100vh - 8rem)",
              expandRows: true,
              headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay",
              },
              editable: true,
              selectable: true,
              events(info, success, failure) {
                fetch(`/api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`)
                  .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not load events");
                    return data;
                  })
                  .then(success)
                  .catch(failure);
              },
              select(info) {
                app.openNew(info.start, info.end);
              },
              eventChange(info) {
                if (info.event.extendedProps.recurring) {
                  info.revert();
                  app.openEdit(info.event);
                } else {
                  app.update(info.event, info.revert);
                }
              },
              eventClick(info) {
                info.jsEvent.preventDefault();
                app.openEdit(info.event);
              },
            });
            this.calendar.render();
          },

          inputDate(value) {
            const date = value instanceof Date ? value : new Date(value);
            const pad = number => String(number).padStart(2, "0");
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
          },

          baseForm() {
            return { title: "", start: "", end: "", frequency: "none", until: "", recurring: false, scope: "series" };
          },

          openNew(start, end) {
            this.editing = false;
            this.event = null;
            this.form = { ...this.baseForm(), start: this.inputDate(start), end: this.inputDate(end) };
            this.modal = true;
            this.$refs.dialog.showModal();
          },

          openEdit(event) {
            const recurring = event.extendedProps.recurring;
            this.editing = true;
            this.event = event;
            this.form = {
              ...this.baseForm(),
              title: event.title,
              start: this.inputDate(event.start),
              end: event.end ? this.inputDate(event.end) : "",
              recurring,
              frequency: event.extendedProps.frequency || "none",
              until: event.extendedProps.until || "",
              scope: "series",
              recurrenceId: event.extendedProps.recurrenceId || "",
            };
            this.modal = true;
            this.$refs.dialog.showModal();
          },

          close() {
            this.modal = false;
            if (this.$refs.dialog.open) this.$refs.dialog.close();
          },

          save() {
            const method = this.editing ? "PUT" : "POST";
            const url = this.editing ? `/api/events/${this.event.id}` : "/api/events";
            fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(this.form),
            })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not save event");
                return data;
              })
              .then(() => {
                this.close();
                this.calendar.refetchEvents();
              })
              .catch(error => alert(error.message));
          },

          remove() {
            const scope = this.form.recurring ? this.form.scope : "series";
            if (!confirm(`Delete ${scope === "occurrence" ? "this event" : "event series"}?`)) return;
            const query = scope === "occurrence" ? "?scope=occurrence" : "";
            fetch(`/api/events/${this.event.id}${query}`, { method: "DELETE" })
              .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not delete event");
              })
              .then(() => {
                this.close();
                this.calendar.refetchEvents();
              })
              .catch(error => alert(error.message));
          },

          update(event, revert) {
            fetch(`/api/events/${event.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title: event.title, start: event.startStr, end: event.endStr }),
            }).then(response => {
              if (!response.ok) throw new Error("Could not update event");
            }).catch(error => {
              alert(error.message);
              revert();
            });
          },
        };
      }
    </script>
  </body>
</html>
